name: Backend CI/CD

on:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.21

      - name: Run Tests
        run: go test ./...
        working-directory: backend

      - name: Code Quality Checks
        run: go vet ./...
        working-directory: backend

      - name: Build Docker Image
        run: docker build -t starttech-backend:latest backend

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ secrets.ECR_REPO }}

      - name: Tag & Push Docker Image
        run: |
          docker tag starttech-backend:latest ${{ secrets.ECR_REPO }}:latest
          docker push ${{ secrets.ECR_REPO }}

      - name: Deploy Backend
        run: ./scripts/deploy-backend.sh ${{ secrets.ALB_DNS_NAME }} ${{ secrets.ECR_REPO }}

      - name: Health Check
        run: ./scripts/health-check.sh http://${{ secrets.ALB_DNS_NAME }}:8080
