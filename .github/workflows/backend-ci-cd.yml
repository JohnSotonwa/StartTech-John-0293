name: Backend Deploy

on:
  push:
    paths: ["Server/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./...
        working-directory: Server
      - run: echo "Deploy via SSH or SSM"
